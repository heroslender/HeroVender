commands:
  sell:
    name: sell
    aliases:
      - sellall
  sellmenu:
    name: sellmenu
  autosell:
    name: autosell
    permisson-message: "&cYou don't have permission to use that."
  shiftsell:
    name: shiftsell
    permisson-message: "&cYou don't have permission to use that."
  herovender:
    name: herovender
    permisson: 'herovender.admin'
    usage: '&bHeroVender &7- &a/herovender <reload>'
autosell:
  strategy: "PICKUP_ITEM"
  settings:
    require-inventory-full: true
    timer-delay: 10
bonus:
  1:
    permission: herovender.vip
    name: VIP bonus
    bonus: 0.08
  2:
    permission: herovender.vip.plus
    name: Bonus VIP+
    bonus: 0.15
delay:
  1:
    permission: herovender.default
    delay: 10000
  2:
    permission: herovender.vip
    delay: 1000
  3:
    permission: herovender.staff
    delay: 0
shops:
  default:
    priority: 1
    items:
      lapis:
        item: LAPIS_LAZULI
        price: 1000.0
      diamond:
        item: DIAMOND
        price: 1000.0
      slime_ball:
        item: SLIME_BALL
        price: 1000.0
  zombie:
    permission: vender.lapis
    priority: 2
    inherits:
      - default
    items:
      rotten_flesh:
        item: ROTTEN_FLESH
        price: 1500.0
      carrot:
        item: CARROT
        price: 5500.0
